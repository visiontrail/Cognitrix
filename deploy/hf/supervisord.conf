[supervisord]
nodaemon=true
user=user
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[program:api]
command=python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8000
directory=/home/user/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    APP_NAME="Cognitrix API",
    APP_ENV="production",
    DATABASE_URL="sqlite:////home/user/app/data/uploads/state/ai_views.sqlite3",
    UPLOAD_DIR="/home/user/app/data/uploads",
    CLAUDE_AGENT_SDK_ENABLED="true",
    AGENTIC_INGESTION_ENABLED="false",
    LEGACY_DATASET_UPLOAD_ENABLED="true",
    LEGACY_SERVICE_LOGIN_ENABLED="true",
    USER_ACCOUNTS_ENABLED="true",
    AUTH_REGISTRATION_ENABLED="true",
    CORS_ALLOW_ORIGINS="*",
    LOG_LEVEL="INFO"

[program:web]
command=npx next start --hostname 0.0.0.0 --port 7860
directory=/home/user/app/apps/web
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    NODE_ENV="production",
    API_BASE_URL="http://127.0.0.1:8000",
    NEXTAUTH_URL="http://localhost:7860",
    NEXTAUTH_SECRET="%(ENV_AUTH_SECRET)s",
    PORT="7860",
    HOSTNAME="0.0.0.0"
