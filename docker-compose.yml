name: cognitrix

services:
  # Persistent-storage owner. This service initializes and reports health for
  # the Cognitrix runtime data volume; only the API writes application data.
  # The volume is shared (not copied) so DuckDB/SQLite keep native file locks.
  storage:
    image: alpine:3.20
    container_name: cognitrix-storage
    restart: unless-stopped
    volumes:
      - cognitrix_upload_data:/storage/uploads
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        # Create required runtime directories without touching existing data.
        mkdir -p /storage/uploads/state /storage/uploads/audit /storage/uploads/agent_skills
        printf 'ready\n' > /storage/uploads/state/.storage_ready
        echo "[storage] persistent storage initialized at /storage/uploads"
        # Stay alive as the storage lifecycle owner.
        exec tail -f /dev/null
    healthcheck:
      test:
        - CMD-SHELL
        - test -d /storage/uploads && test -w /storage/uploads/state && touch /storage/uploads/state/.storage_health && rm -f /storage/uploads/state/.storage_health
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cognitrix-api
    restart: unless-stopped
    depends_on:
      storage:
        condition: service_healthy
    environment:
      APP_NAME: Cognitrix API
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/uploads/state/ai_views.sqlite3}
      MODEL_PROVIDER_URL: ${MODEL_PROVIDER_URL:-https://api.deepseek.com}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-deepseek-chat}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-600000}
      CLAUDE_AGENT_SDK_ENABLED: ${CLAUDE_AGENT_SDK_ENABLED:-true}
      AGENTIC_INGESTION_ENABLED: ${AGENTIC_INGESTION_ENABLED:-false}
      LEGACY_DATASET_UPLOAD_ENABLED: ${LEGACY_DATASET_UPLOAD_ENABLED:-true}
      AGENT_MAX_TOOL_STEPS: ${AGENT_MAX_TOOL_STEPS:-20}
      AGENT_MAX_SQL_ROWS: ${AGENT_MAX_SQL_ROWS:-2000}
      AGENT_MAX_SQL_SCAN_ROWS: ${AGENT_MAX_SQL_SCAN_ROWS:-10000}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-120}
      INGESTION_PLAN_TIMEOUT_SECONDS: ${INGESTION_PLAN_TIMEOUT_SECONDS:-600}
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-a-strong-secret}
      USER_ACCOUNTS_ENABLED: ${USER_ACCOUNTS_ENABLED:-true}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-true}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-120}
      INVITE_LINK_TTL_DAYS: ${INVITE_LINK_TTL_DAYS:-14}
      LEGACY_SERVICE_LOGIN_ENABLED: ${LEGACY_SERVICE_LOGIN_ENABLED:-false}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
      AUTH_BOOTSTRAP_SUPERADMIN_EMAIL: ${AUTH_BOOTSTRAP_SUPERADMIN_EMAIL:-}
      AGENT_SKILLS_ENABLED: ${AGENT_SKILLS_ENABLED:-false}
      AGENT_SKILLS_DIR: ${AGENT_SKILLS_DIR:-}
      AGENT_SKILLS_MAX_UPLOAD_MB: ${AGENT_SKILLS_MAX_UPLOAD_MB:-25}
      LEGACY_XLSX_PARSER_ENABLED: ${LEGACY_XLSX_PARSER_ENABLED:-true}
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - cognitrix_upload_data:/app/data/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NPM_FETCH_RETRIES: ${NPM_FETCH_RETRIES:-5}
        NPM_FETCH_RETRY_MINTIMEOUT: ${NPM_FETCH_RETRY_MINTIMEOUT:-20000}
        NPM_FETCH_RETRY_MAXTIMEOUT: ${NPM_FETCH_RETRY_MAXTIMEOUT:-120000}
        NPM_FETCH_TIMEOUT: ${NPM_FETCH_TIMEOUT:-600000}
        NPM_HTTP_PROXY: ${NPM_HTTP_PROXY:-}
        NPM_HTTPS_PROXY: ${NPM_HTTPS_PROXY:-}
    container_name: cognitrix-web
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://127.0.0.1:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-replace-with-a-strong-secret}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  # Preserved volume identity. With Compose project name `cognitrix` and this
  # key, Docker generates the volume `cognitrix_cognitrix_upload_data`, which is
  # the existing volume. Do not rename the key; renaming would orphan user data.
  cognitrix_upload_data:
